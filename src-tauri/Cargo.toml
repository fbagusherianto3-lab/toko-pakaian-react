[package]
name = "toko-pakaian"
version = "0.1.0"
description = "Aplikasi toko pakaian"
edition = "2021"

[lib]
name = "toko_pakaian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
